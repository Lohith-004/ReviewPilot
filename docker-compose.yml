services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewpilot-api
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://reviewpilot:reviewpilot@postgres:5432/reviewpilot
      REDIS_URL: redis://redis:6379/0
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
    volumes:
      - ./ai-reviewpilot.2026-10-02.private-key.pem:/run/secrets/github_app_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reviewpilot-worker
    command:
      [
        "rq",
        "worker",
        "reviewpilot",
        "--worker-class",
        "rq.worker.SimpleWorker"
      ]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://reviewpilot:reviewpilot@postgres:5432/reviewpilot
      REDIS_URL: redis://redis:6379/0
      GITHUB_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
    volumes:
      - ./ai-reviewpilot.2026-10-02.private-key.pem:/run/secrets/github_app_private_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: reviewpilot-postgres
    environment:
      POSTGRES_USER: reviewpilot
      POSTGRES_PASSWORD: reviewpilot
      POSTGRES_DB: reviewpilot
    ports:
      - "5433:5432"
    volumes:
      - reviewpilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U reviewpilot -d reviewpilot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: reviewpilot-redis
    ports:
      - "6379:6379"
    volumes:
      - reviewpilot-redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  reviewpilot-postgres-data:
  reviewpilot-redis-data: